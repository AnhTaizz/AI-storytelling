# Narrative Profile used by the M1 runs (casual spoken Vietnamese, young audience).
# A profile, not a standard: see Script Quality Contract v0, section 3.
profile_id: VI_YOUTUBE_CASUAL_V0
target_language: vi
brief_language: vi
audience: "Khán giả YouTube Việt Nam 15-25 tuổi"
narration: "Người kể chuyện ngôi thứ ba, giọng kể chuyện nói tự nhiên như đang trò chuyện"
tone: "Gần gũi, hơi dí dỏm, nhưng tôn trọng cảm xúc của nhân vật"
humor_level: light
commentary_intensity: medium
hook_style: curiosity-first
length_words:
  min: 900
  max: 1100
call_to_action: false
name_policy: "Dùng tên phiên âm Latin theo cách phiên âm chuẩn của ngôn ngữ gốc (ví dụ tiếng Nhật: Amane, Mahiru; tiếng Hàn: Ji-woo, Seo-yeon); truyện Trung dùng âm Hán-Việt (ví dụ Lâm Uyển Nhi, Tiêu Viêm). Không để chữ viết gốc (kanji, kana, Hangul, chữ Hán...) trong kịch bản."
# DEC-020: Chinese names are read in Sino-Vietnamese (âm Hán-Việt), as Vietnamese readers know them.
name_readings:
  zh: "the Sino-Vietnamese reading (âm Hán-Việt) of the Chinese characters, with Vietnamese diacritics and each syllable capitalised, never pinyin: 林婉儿 → Lâm Uyển Nhi, 萧炎 → Tiêu Viêm, 小婉 → Tiểu Uyển. Translate titles and epithets instead of transliterating them."
