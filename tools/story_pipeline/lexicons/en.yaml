# English lexicon (for English sources, briefs or scripts).
language: en
word_boundaries: true
chars_per_event: 1600
clause_markers: [and, but, after, before, when, if, because, then, while]
# A hedge does not reach across a contrast: in "I don't know her, but rumour says she is
# perfect" the rumour is only in the second part. Openers start such a part.
contrast_openers: [but, although, though, yet]
strength:
  degree_extreme: [extremely, incredibly, utterly]
  completeness: [completely, totally, entirely, from head to toe]
  quantity_large: [countless, a lot of, lots of]
  universality: [everyone, everybody, all of them]
  frequency_always: [always, never, constantly]
  certainty: [certainly, definitely, surely]
  firmness: [firmly, flatly, adamantly]
  reputation: [nickname, famous]
  intensity_fill: [full of, filled with]
hedge:
  reported: [reportedly, rumor, rumour, rumored, said to, supposedly, apparently]
  appearance: [seems, seemed, appears, appeared, looked like, as if]
  speculation: [maybe, perhaps, probably, might]
  metaphor: [likened, metaphor, compared to, like an]
