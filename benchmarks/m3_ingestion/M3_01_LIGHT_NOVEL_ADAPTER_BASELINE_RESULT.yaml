  not_adopted: [OTONARI_LOCAL_PASSAGE_V1, PARAGRAPH_PACK_V1 packing, 1200-character hard split, chNNN_cNNNN ids, 30-chapter assumptions, hard-coded private paths, ordinal-only corpus fingerprint]
  historical_fingerprint: "7f9bb810... remains the identity of the historical benchmark corpus; it is not a LIGHT_NOVEL_INGESTION/v0 fingerprint"

known_limitations:
  - "Plain UTF-8 text only. No EPUB, HTML, ruby/furigana markup, illustrations or front matter handling."
  - "Paragraphs are separated only by blank lines. A source that separates paragraphs by single line breaks yields one segment per block of consecutive lines."
  - "Any change to a document's bytes gives all of its segments new ids. There is no mapping between versions of a document."
  - "Discourse positions have segment granularity. A sub-span reference shares its segment's position."
  - "One discourse stream per manifest (as in canonical_story/v0)."
  - "Character offsets are Unicode code points, not UTF-16 units or grapheme clusters."
  - "A byte-order mark is treated as source content and stays in the first segment."
  - "The adapter holds whole documents in memory; no streaming."
  - "Evidence roles and paratext detection are out of scope; front or back matter inside a document is segmented like any other text."
  - "Validated on synthetic input and five tracked sample documents of one story. The private 30-document corpus was not used."

next_step_recommendation: "M3-02: validate the adapter on the full controlled corpus (privately), compare segment spans with the historical chunk spans for traceability, and decide whether the contract is ready for a freeze review."
