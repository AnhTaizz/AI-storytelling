    segmentation_verdict: PARAGRAPH_SEGMENT_V0_ACCEPTABLE_WITH_LIMITATION
    rationale:
      - "SourceSegment is provenance, not semantic homogeneity."
      - "Exact sub-span references remain available."
      - "EvidenceRole belongs to EvidenceRef spans."
    note: "Accepted V0 behaviour. Not claimed to be ideal."

known_limitations:                   # accepted for V0; they do not invalidate it
  - "Controlled plain-text UTF-8 only"
  - "No EPUB, HTML, ruby or furigana adapter"
  - "Segmentation depends on blank-line source formatting"
  - "Segment granularity can differ between documents"
  - "Mixed semantic material can share a segment"
  - "No automatic source-version migration or alignment"
  - "A sub-span shares its segment's DiscoursePosition"
  - "One discourse stream per manifest"
  - "Full documents are held in memory"
  - "A byte-order mark is preserved as source content"
  - "No paratext or evidence-role inference in M3"
  - "Validation covers one story, one source and one language"
  - "The real corpus has no paragraph over 1200 characters, so the no-split stress case is synthetic"
  - "The segment audit was done by an AI reviewer; most segments were not read individually"

