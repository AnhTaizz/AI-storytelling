  m4_must_not_assume: "one SourceSegment == one EvidenceRole"
  granularity: "Segment granularity follows controlled source formatting and may legitimately differ between documents."
  retrieval: "SourceSegment != RetrievalChunk; retrieval units must trace to source provenance."

