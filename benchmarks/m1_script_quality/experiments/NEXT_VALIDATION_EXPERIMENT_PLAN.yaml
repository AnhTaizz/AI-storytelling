experiment_design:
  id: H7
  name: Targeted Semantic Validation Pass (Motive/Internal State)
  hypothesis: Adding an explicit motive/internal-state validation pass after deterministic
    claim-level auditing increases robust semantic recall without materially reducing
    precision.
  target_failure_family: MOTIVE_OR_INTERNAL_STATE_INVENTION
  justification: Largest observed failure cluster (7 of 22 misses) in RUN7, achievable
    within existing boundaries without RAG/Graph complexity.
  data_splits:
    exploratory_development_set: RUN3_H2_STORY_BRIEF
    confirmatory_holdout: FRESH_CONTROLLED_STORY_REQUIRED
  architecture_requirements:
    rag_required: false
    graph_required: false
    story_memory_required: false
  success_criteria:
    baseline_metrics:
      primary_precision: 1.0
      primary_recall: 0.3333
      primary_f1: 0.5
    target_metrics:
      primary_recall_improvement: '> 0.0'
      primary_precision_degradation: < 0.05
      false_positives: < 3
      schema_conformance: PASS
      mechanical_coverage: 100%
    protocol:
      primary_semantic_attempts: 1
      quality_based_regeneration: 0
