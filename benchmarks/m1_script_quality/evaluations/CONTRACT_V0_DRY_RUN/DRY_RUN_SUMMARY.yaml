length_edge_case:      # RUN_0003: target 900-1100, recorded 1648
  severity_under_existing_wording: MEDIUM
  reason: "Section 14 lists 'length outside tolerance' as a typical MEDIUM case. HIGH and CRITICAL are defined by story interpretation or an unusable deliverable; neither fits. No rule scales severity with the size of the overrun."
  required_repair: MAJOR
  gate_status: GATE_CONDITIONAL
  verdict_from_length_alone: REVIEW_REQUIRED      # through edit cost MAJOR, not through the gate
  assessment: CONTRACT_SEMANTIC_GAP
  gap: "Section 15 says GATE_REQUEST_COMPLIANCE fails on 'requested length or scope not met', but under sections 14-15 a length finding can never be material, so the gate cannot fail on length. A 1-word and a 500-word overrun get the same gate status."

materiality_sanity_check:
  levels_assigned_without_contradiction: [LOW, MEDIUM, HIGH]
  CRITICAL: "not observed in either script; definition was usable to rule it out"
  examples:
    - {kind: unsupported minor staging, findings: [A13, A16, B15], severity: LOW}
    - {kind: unsupported motive or internal state, findings: [A05, A06, A24, B14], severity: MEDIUM}
    - {kind: internal state close to supported content, findings: [A07, A23, B04, B18], severity: LOW}
    - {kind: certainty inflation, findings: [A11, A14, B16], severity: MEDIUM}
    - {kind: certainty inflation with negligible impact, findings: [A28, B05, B19], severity: LOW}
    - {kind: knowledge overclaim resolving the scope's central unknown, findings: [A22], severity: HIGH}
    - {kind: major factual contradiction, findings: [], severity: "none observed"}
    - {kind: length noncompliance, findings: [A29], severity: MEDIUM}
    - {kind: pacing weakness, findings: [], note: "soft dimension PACING = 2 for RUN_0003; not a severity"}
  observation: "Severity by impact was workable for story-truth findings. The same family received different levels by impact, as section 14 intends. The framework has no described HIGH case for request or output findings."

operational_issues_first_pass:
  - {id: OP-01, issue: "Length severity and GATE_REQUEST_COMPLIANCE 'fails on' wording conflict; no magnitude rule"}
  - {id: OP-02, issue: "Severity definitions are story-centric; request/output findings have MEDIUM and CRITICAL examples but no HIGH"}
  - {id: OP-03, issue: "No subtype for invented speech or invented descriptive attributes; recorded at parent level"}
  - {id: OP-04, issue: "No stated fidelity standard for reconstructed or translated direct quotes"}
  - {id: OP-05, issue: "No tie-break when PREMATURE_SPOILER and CERTAINTY_INFLATION both apply (boundary-level suggestion about the future stated as fact)"}
  - {id: OP-06, issue: "Free indirect thought: one finding or two (the thought, and its content)"}
  - {id: OP-07, issue: "Hedged guess: narrator's or character's is sometimes undecidable"}
  - {id: OP-08, issue: "Cumulative escalation decided a gate; no guidance on recording the escalated set"}
  - {id: OP-09, issue: "Request and Narrative Profile had to be assembled from manifest plus prompt"}
  - {id: OP-10, issue: "Recorded word count method unstated; two counts differ by 5%"}
  - {id: OP-11, issue: "Template has no place to distinguish a provisional AI trace from the contract verdict"}
