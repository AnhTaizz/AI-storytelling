# Search for an already-established competence threshold. None exists, so none is claimed.
competence_threshold_search:
  conclusion: NO_PRIOR_NORMATIVE_NUMERIC_COMPETENCE_THRESHOLD
  sources_inspected:
    - path: docs/research/m4/M4_EXTRACTION_EVALUATION_PROTOCOL_V0.md
      finding: Section 12 defines the metrics and states that no single accuracy and no weighted combination is defined.
    - path: docs/research/m4/M4_STORY_EXTRACTION_CONTRACT_V0.md
      finding: States that no threshold-based acceptance is defined.
    - path: tools/story_extraction/m4_04b2_dev_protocol_v1.py
      finding: Locks the B2 safety gate as eight pass/fail conditions. It contains no competence number.
    - path: tools/story_extraction/evaluate_m4_04b2r_dev_v2.py
      finding: Selection is an ordered comparison between two candidates, not an absolute floor. Extractor lockability equals the safety gate.
    - path: benchmarks/m4_extraction/M4_04B2_DEVELOPMENT_EXTRACTION_BENCHMARK_RESULT.yaml
      finding: Leader failed the safety gate on L0. Two L0-valid cases, assertion recall 0.0, zero full canonical case successes.
    - path: benchmarks/m4_extraction/M4_04B3D3_DEV2_V1_1_MIGRATION_RESULT.yaml
      finding: The 10 of 10 structural-validity gate belonged to an offline migration diagnostic. DEV2 was never quality-scored.
    - path: benchmarks/m4_extraction/M4_EVALUATION_PROTOCOL_SNAPSHOT_V2.yaml
      finding: Binds evaluator identity only. It carries no acceptance threshold.
  new_threshold:
    marker: NEW_PRE_REGISTERED_DEV3_THRESHOLD
    status: NOT_INTRODUCED
    rationale:
      - No locked model output has ever been scored with non-zero recall, so there is no empirical basis to calibrate a floor.
      - DEV3 has ten cases and agent-drafted gold that no human has confirmed.
      - Any number chosen now would be arbitrary, and the conservative manual-holdout rule is preferred.

