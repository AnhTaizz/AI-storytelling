fail_closed_clarifications:
  ZERO_UNRATED_UNSUPPORTED: >-
    For COMPLETE_FOR_PROFILE gold the frozen evaluator records an unmatched prediction as UNSUPPORTED_ASSERTION
    with severity UNRATED and treats it as material. The B2R gate counted only CRITICAL and HIGH, so an unrated
    claim could have passed. It now blocks a safety PASS until it is adjudicated.
  ZERO_PENDING_ADJUDICATION: >-
    A prediction left GOLD_UNMATCHED_PENDING_ADJUDICATION has no severity. It blocks a safety PASS.
  effect: These checks can only turn a PASS into a FAIL. They never turn a FAIL into a PASS.

