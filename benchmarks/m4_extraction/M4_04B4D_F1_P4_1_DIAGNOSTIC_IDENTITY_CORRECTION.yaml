    reasoning: The instruction is satisfied by any change, including one no finding requires, and so contradicts
      the instruction to change only what a finding requires.
    assessment: REVISION_REQUIRED
    V1_1_wording: An unchanged response is rejected again for the same findings. The changes that help are the ones
      the findings require. Do not change anything else to make the response look different.
  - B4D_wording: If a finding cannot be corrected without asserting something the passages do not support, remove
      the record that breaks the rule, together with the records that depend on it, instead of inventing a replacement.
    may_encourage:
      arbitrary_change_to_make_bytes_differ: NOT_DIRECTLY
      deleting_otherwise_supported_information: PLAUSIBLE
      excessive_record_removal: PLAUSIBLE
      empty_but_compiler_valid_drafts: POSSIBLE
      trading_coverage_for_validity: PLAUSIBLE
    reasoning: The set of dependent records was unbounded, removal was not ranked below correction, and structural
      validity cannot see removed content. An ambiguous quote and a duplicate proposition can always be corrected
      without losing content; the two registry rule classes may have no supported correction, so removal is kept
      as a bounded last resort.
    assessment: REVISION_REQUIRED
    V1_1_wording: 'Correct a finding inside its record whenever the passages support a correction: add the occurrence,
      correct the handle, correct the registry value, keep one of two identical propositions. Removing a record
      is the last resort. Use it only when no correction of that record is supported by the passages. Then remove
      that record and only the records that cannot exist without it. Keep every record that no finding names and
      that does not depend on a removed record. Do not remove supported records to make the draft pass, and do not
      return an empty or reduced draft in place of a correction.'
