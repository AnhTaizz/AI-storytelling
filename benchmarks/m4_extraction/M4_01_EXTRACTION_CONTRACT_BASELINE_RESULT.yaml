contract_rules_tested:
  - batch envelope validation and rejection of non-canonical collections
  - deterministic merge independent of candidate order
  - id collision and dangling reference rejection
  - batch bound to its base document identity
  - automated assertions must be UNREVIEWED; confidence does not change that
  - human confirmation requires a recorded human review
  - evidence role explicit; exact span required and checked against the source
  - context-only passages cannot be cited as evidence
  - evidence after the as-of boundary rejected
  - mixed segment with role-specific sub-spans; paratext cannot ground a story assertion
  - unregistered derivation rule and invented epistemic status rejected by the frozen validator
  - holder-relative content not promoted to canonical truth
  - event record without Occurred is not an occurrence
  - prior canonical context extended without rewriting earlier records

metric_definitions:
  assertion_precision: "predicted assertions matched to gold (required or acceptable) / predicted assertions"
  assertion_recall: "required gold assertions recovered / required gold assertions"
  evidence_grounding_precision: "matched predictions with valid grounding / matched predictions"
  evidence_grounding_recall: "required gold assertions recovered with valid grounding / required gold assertions"
  epistemic_accuracy: "matched predictions with the gold epistemic status / matched predictions"
  evidence_role_accuracy: "predicted evidence refs with a gold role / predicted evidence refs whose span exists in gold"
  referent_resolution_accuracy: "required gold RefersTo recovered / required gold RefersTo"
  unsupported_assertion_rate: "predicted assertions matched to no gold assertion / predicted assertions"
  full_canonical_case_success: "L0 passes; every required commitment recovered with right polarity, status, validity and grounding; no material unsupported commitment"
  single_overall_accuracy_defined: false

failure_taxonomy:
  codes_defined: 19
  codes_assigned_mechanically: 15
  codes_needing_human_relabel: [WRONG_PREDICATE, WRONG_ARGUMENT, WRONG_EVENT_GRANULARITY, NON_ATOMIC_ASSERTION]
  severity_levels: [CRITICAL, HIGH, MEDIUM, LOW]

dev_holdout_protocol:
  m2_private_real_source_mappings: "development evidence only; never an independent M4 holdout"
  holdout_cases_selected: false
  holdout_gold_exists: false
  rule: "fresh holdout spans selected before any extractor is tuned; gold sealed until baseline and protocol are fixed"

unresolved_evaluation_questions:
  - Q1 span tolerance on real text
  - Q2 entities with no mention
  - Q3 identity classes (one entity vs two entities joined by SameAs)
  - Q4 event granularity differences
  - Q5 named-time anchors and placeholder propositions
  - Q6 free-text literal equivalence
  - Q7 materiality of unsupported assertions
  - Q8 completeness of real gold
  - Q9 alternative acceptable groundings

known_limitations:
  - "Nothing is frozen; no real-source extraction has been run against the contract"
  - "Fixtures are synthetic English; gold is agent-authored and unreviewed"
  - "Exact span matching; alignment is greedy, not general graph matching"
  - "Unsupported means 'not in gold'; on real text it needs adjudication before being read as hallucination"
  - "Event individuation and coverage are guidance, not operational rules"
  - "The validator checks that evidence lies in eligible inputs, not that it truly supports the claim"

m4_02_recommendation: "Build real-source development cases from already-seen material as extraction batches on the private M3 source layer; settle Q1-Q9 on development cases; select and seal a fresh holdout before any extractor or prompt is tuned. No model selection until the measuring stick is exercised on real gold."
