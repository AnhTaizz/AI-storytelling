limitations:
  - "Same story, same corpus, same language as the development data."
  - "Gold was written by the same AI agent that built the contract and the evaluator; no human has reviewed it."
  - "The annotator had prior exposure to the story as a whole, although not to these spans."
  - "Only 180 of 1519 segments were outside the exposure registry and its halo, so cases come from short unexposed gaps: windows are 5-7 segments and long-range evidence is nearly absent."
  - "No case shows state change, causality or mixed paratext; the distribution is whatever the hash order produced."
  - "Required gold is small in some cases (minimum 1 required assertion): much of that text states things the registry cannot express."
  - "Six protocol issues were recorded where the profile or registry could not express stated content (character traits, kinship, setting-limited relations, non-event causes, results)."
  - "The selection lock is evidenced by a public commit made before annotation; it is not externally timestamped."

