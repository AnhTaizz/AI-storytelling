interpretation:
  - Role errors are one systematic error, not noise. Every one is DEPICTION where gold uses NARRATION_SUMMARY or RETROSPECTIVE, in narration. The P4R6 prompt change that made DEPICTION the default (tuned on DEV2) overcorrected for sets that contain summary and flashback narration.
  - Nine of 30 unsupported predictions are non-names asserted as NamedAs. A prompt rule (only proper names and name forms are NamedAs; role nouns and common nouns are not) or a convention clarification addresses them.
  - Five Participates errors sit on the PATIENT/THEME boundary of R-ROLE-03 and count twice (one miss, one unsupported).
  - Together these three patterns account for 10 role errors, 14 unsupported predictions and at least 5 misses.
next_candidates:
  - Conventions V5 (owner decision) on the evidence role of mentions in non-depicted narration (follow the sentence role), and on NamedAs for role and common nouns.
  - Prompt P4R9 developed on FV2-dev and FV3-dev together, measured on both, with a host role propagation for mentions inside sentences whose other evidence carries NARRATION_SUMMARY or RETROSPECTIVE.
  - Run-to-run variance sample before any further locked run; the holdout stays closed.
