findings:
  - Evidence grounding (L1) was the first failing layer in 8 of 12 cases and the main blocker.
    Coverage (L4) was first in 3 cases, and 1 case fully passed.
  - Of 166 matched assertions, 138 were grounded. WRONG_EVIDENCE_SPAN accounted for 28 failures
    (RefersTo 11, NamedAs 6, Occurred 3, Participates 3, Owns 2, Possesses 2, TemporalRelation 1).
    Span geometry was EXACT 87, PRED_WIDER 68, PRED_NARROWER 9, PARTIAL_OVERLAP 1, and
    NO_OVERLAP_SAME_PASSAGE 1. The model tended to cite wider spans for mention-level assertions
    (52 RefersTo and 14 NamedAs matches). Wider spans fail where the evaluator requires exact spans.
  - There were 4 WRONG_EVIDENCE_ROLE failures at L1 and 6 WRONG_VALIDITY_BOUND failures at L2
    (Possesses 5, Owns 1).
  - Of 21 missed required assertions, 9 were REFERENT_MISMATCH (Participates 5, Occurred 2, AnchorDate 2),
    8 were OTHER_PREDICATE, 3 were NOT_EXTRACTED, and 1 was VALUE_MISMATCH. The cause counts were
    EVENT_NOT_ALIGNED 5, TEMPORAL_STRUCTURE 3, NAMING_NOT_EMITTED 2, MISSING_PARTICIPANT 1, and
    OTHER_OMISSION 10. Of 7 missed RefersTo resolutions, 6 were MENTION_SPAN_DIFFERS and 1 was
    NOT_EXTRACTED.
  - Of 17 unsupported assertions, 9 were PAIRED_WITH_MISS, 3 were PAIRED_WITH_MISSED_RESOLUTION,
    and 5 were ON_GOLD_EVIDENCE. The reported classes account for all 17, so NO_GOLD_ON_EVIDENCE
    was 0. The tool classified none as lying on source evidence the gold leaves unannotated.
    Most were the prediction side of a mechanically identified mismatch.
