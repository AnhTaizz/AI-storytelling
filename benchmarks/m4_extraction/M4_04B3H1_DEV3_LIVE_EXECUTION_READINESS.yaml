# Why a pure LF checkout cannot be fully green, and what was done instead.
historical_line_ending_failures:
  eliminated_in_execution_checkout: true
  pure_LF_checkout_fully_green: false
  CRLF_worktree_story_extraction: 417/422
  CRLF_worktree_failing_tests:
    test_m4_04b3a_forensics_v1: 1
    test_m4_04b3b2_dev2_protocol_v1: 4
  pure_LF_checkout_story_extraction: 417/422
  pure_LF_checkout_failing_tests:
    test_m4_04b3b2_dev2_protocol_v1: 4
    test_draft_schema_v1_1: 1
  cause: >-
    The DEV2-era locks (B3B1, B3B2, B3C) pin raw-byte SHA-256 values of the CRLF working copies of
    the Draft V1 schema and compiler V1, next to LF hashes of the predicate registry, runtime and
    durable executor. Those two CRLF hashes never existed as repository content, so no uniform
    checkout satisfies every lock.
  resolution: >-
    Every tracked file is byte-identical to its repository blob except exactly the two files listed
    in crlf_exception_files, which are materialized with CRLF. Neither file is part of the P3
    extractor stack or the Snapshot V2 evaluation stack.
  historical_raw_byte_hash_semantics_changed: false
  historical_tools_or_tests_patched: false
  deviation_from_task_brief:
