  confidence: HIGH
  structural_evidence:
    blockers: 9
    all_on_mention_records: true
    all_quotes_exist_and_repeat_exactly: true
    all_omit_occurrence: true
    rule_stated_in_prompt: true
    rule_enforceable_by_schema_or_projection: false
    other_repeated_quote_locators_carried_an_occurrence: 7
    every_valid_occurrence_choice_clears_the_blocker: true
  supporting: Every ambiguous-quote blocker is a mention whose exact quote occurs more than once in an evidence-eligible
    passage and which omits occurrence. The prompt states that occurrence is mandatory in exactly that situation. The compiler
    applied the stated rule.
  contrary: The rule cannot be enforced by the model schema or the provider projection, so nothing stops a schema-valid
    draft from breaking it. In the repair attempts the finding masked which mention was ambiguous. Both points bear on how
    the rule is delivered, not on whether it was stated.
  uncertainty: Why the model applied the rule to some repeated quotes and not to others is not observable offline. One run
    at temperature 0 cannot separate a stable tendency from chance.
