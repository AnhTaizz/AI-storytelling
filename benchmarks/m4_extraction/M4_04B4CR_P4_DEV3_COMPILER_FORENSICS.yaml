alternative_explanations:
  D_DETERMINISTIC_COMPILER_DEFECT:
    supported: false
    evidence: No compiler defect was demonstrated. The instrumented and plain compilations agree, every outcome and every
      compiled batch reproduces, and each rejected canonical structure is already in the model draft. A defect claim would
      need an input that the frozen canonical contract requires the compiler to accept; none was found.
  E_CANONICAL_CONTRACT_MISMATCH:
    supported: false
    evidence: No conflict between the canonical contract and the draft contract was found. The canonical rules are stricter
      than the model output schema, which is a gap in what the schema can express, not a contradiction.
  F_EXECUTION_OR_SERIALIZATION_DEFECT:
    supported: false
    evidence: Not supported. All raw, draft, compiled and failure-record hashes match, request fingerprints rebuild from
      the input, and the prediction set rebuilds from the artifact files.
limitations:
- No semantic quality was measured. Structural validity says nothing about whether extracted content is correct.
- DEV3 gold was not opened and nothing was evaluated against it.
- No model was called. Why the model produced a given draft or repeated a response is not observable offline.
- DEV3 is tuning data for P4. Nothing here is fresh validation.
- Sixteen attempts on ten cases from one source family, each sent once. Counts this small do not generalize.
- The compiler stops canonical validation at the first failed batch, and a quote blocker hides later checks. Blockers that
  would appear after a fix are known only where a counterfactual exposed them.
- Counterfactuals show that an edit removes a blocker. They are not predictions and say nothing about which occurrence or
  structure is correct.
decision:
  next_research_candidate:
  - P4.1 VERSIONED REPAIR DIAGNOSTIC REDESIGN
  - P4.1 VERSIONED QUOTE-LOCATOR / COMPILER-INTERFACE REDESIGN
  - CANONICAL CONTRACT CLARIFICATION
  recommendation_evidence:
    P4.1 VERSIONED REPAIR DIAGNOSTIC REDESIGN: 'Supported by the diagnostic audit: every compiler finding sent to repair
      masked the record handle, the canonical finding named no check and no record, several blockers were collapsed into
      one finding, and no canonical failure was cleared by repair.'
    P4.1 VERSIONED QUOTE-LOCATOR / COMPILER-INTERFACE REDESIGN: 'Supported by the quote forensics: the largest single blocker
      is an omitted occurrence on a repeated exact quote, a rule the prompt states but which the schema and provider projection
      cannot enforce. Every valid occurrence choice clears the blocker.'
    CANONICAL CONTRACT CLARIFICATION: 'Supported by the conformance forensics: the three canonical rule classes that failed
      are enforced only after compilation, are accepted by the model output schema, and reach the model as unexplained registry
      data or not at all.'
  not_recommended:
    CANONICAL COMPILER DEFECT INVESTIGATION: Not supported. All sixteen outcomes reproduce, the rejected structures are
      already in the model drafts, and no input was found that the frozen contract requires the compiler to accept.
  implementation_authorized: false
  requires_orchestrator_authorization: true
  semantic_quality_claim: false
