  - requirement: OCCURRENCE_REQUIRED_WHEN_THE_EXACT_QUOTE_REPEATS
    enforced_by: COMPILER_QUOTE_RESOLUTION
    classification: EXPLICIT_AND_CORRECT
    observed_in_the_locked_failures: true
    note: The prompt states the rule in words. The schema leaves occurrence optional and cannot express uniqueness, so neither
      the schema nor the provider projection can enforce it.
  - requirement: EXACT_QUOTE_MATCH_WITHOUT_NORMALIZATION
    enforced_by: COMPILER_QUOTE_RESOLUTION
    classification: EXPLICIT_AND_CORRECT
    observed_in_the_locked_failures: false
    note: The prompt requires an exact quote and tells the model to preserve Unicode, punctuation and whitespace. No quote-not-found
      failure was observed.
  - requirement: OVERLAPPING_MATCHES_COUNT_AS_OCCURRENCES
    enforced_by: COMPILER_QUOTE_RESOLUTION
    classification: ABSENT
    observed_in_the_locked_failures: false
    note: The compiler counts overlapping matches. The prompt does not say so. No observed ambiguity arose only from overlapping
      matches.
  - requirement: LOCATORS_ONLY_IN_EVIDENCE_ELIGIBLE_PASSAGES
    enforced_by: COMPILER_QUOTE_RESOLUTION
    classification: EXPLICIT_AND_CORRECT
    observed_in_the_locked_failures: false
    note: Stated in the prompt. Every observed locator was in an evidence-eligible passage.
  - requirement: MENTION_EVIDENCE_BINDING
    enforced_by: COMPILER_V1_1_BINDING
    classification: EXPLICIT_AND_CORRECT
    observed_in_the_locked_failures: false
    note: The prompt says a mention carries no evidence handle and the compiler binds it. No binding failure was observed.
  - requirement: HANDLE_AND_REFERENCE_TYPE_CORRECTNESS
    enforced_by: COMPILER_HANDLE_CHECKS
    classification: EXPLICIT_AND_CORRECT
    observed_in_the_locked_failures: false
    note: Handle patterns are in the schema and the prompt requires type-correct handles. No handle failure was observed.
  - requirement: ARGUMENT_ENTITY_KIND_ALLOWED_BY_REGISTRY
    enforced_by: CANONICAL_VALIDATOR_PREDICATE_INTEGRITY
    classification: IMPLICIT_ONLY
    observed_in_the_locked_failures: true
    note: The constraint is in the registry text inside the prompt as a field of the argument. The prompt prose never says
      that the referenced entity must have one of those kinds.
  - requirement: DERIVATION_RULE_MAY_CONCLUDE_THE_ASSERTED_PREDICATE
    enforced_by: CANONICAL_VALIDATOR_DERIVATION_INTEGRITY
    classification: IMPLICIT_ONLY
    observed_in_the_locked_failures: true
    note: Each rule lists its conclusion predicates in the registry text inside the prompt. The prompt prose never says
      that a derivation may only support an assertion of one of those predicates.
  - requirement: PROPOSITIONS_WITH_IDENTICAL_CONTENT_MUST_BE_ONE_RECORD
    enforced_by: CANONICAL_VALIDATOR_PREDICATE_INTEGRITY
    classification: ABSENT
    observed_in_the_locked_failures: true
    note: Neither the prompt, the schema nor the registry text tells the model that two propositions with the same content
      are rejected.
  - requirement: EXTRACTION_ENVELOPE_AND_HOST_OWNED_FIELDS
    enforced_by: COMPILER_AND_BATCH_VALIDATOR
    classification: NOT_APPLICABLE
    observed_in_the_locked_failures: false
    note: The host builds the envelope and provenance. The model never outputs them and no envelope failure was observed.
  - requirement: REPAIR_INSTRUCTIONS_FOR_COMPILER_FINDINGS
    enforced_by: REPAIR_PROMPT_AND_DIAGNOSTIC_V2
    classification: AMBIGUOUS
    observed_in_the_locked_failures: true
    note: The repair prompt says each finding gives a path and the schema rule broken there. A compiler finding gives a
      code and a path with the record handle masked, and for canonical conformance it gives no check and no record at all.
