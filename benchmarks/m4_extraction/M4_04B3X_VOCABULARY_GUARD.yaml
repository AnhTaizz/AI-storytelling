evaluation_data:
  label: DEVELOPMENT-ONLY
  sets: [FV2-dev, DEV2, DEV1]
  only_validation_result: M4_04B3O_FV2_BLIND_RUN_RESULT.yaml
runner:
  file: tools/story_extraction/run_m4_p4_dev_v1.py
  repair: tools/story_extraction/draft_vocabulary_guard_v1.py
  option: --vocabulary-guard
  default_enabled: false
  suffix: '+VG'
  repair_order: [QR, AM, ME, SE, TB, DA, VG]
  vocabulary: VG checks TOKEN arguments using the same canonical predicate registry loader as the conformance check.
  normalization: VG uses the uppercase, underscore form when it is in the vocabulary.
  removal: For an out-of-vocabulary value, VG drops the proposition and its assertions unless another reference to the proposition requires it to refuse the drop. VG removes evidence left unreferenced by the drop.
method:
  comparison: Offline replay of each saved run with VG off and on. Replay made no model calls.
  base_repairs: QR+AM+ME+SE+TB+DA
  gold_alignment: In memory for scoring. FV2-dev uses V3 then V4, DEV2 uses V4, and DEV1 uses sealed gold.
  model_samples_per_prompt: 1
