findings:
  - Full-case success requires no required misses, no unsupported predictions and clean evidence.
    L4 and U together block 11 of 12 cases. Removing L4 and U alone gives 6 full successes.
    Adding L1 gives 11. Evidence fixes alone leave full success at 1.
  - Representation alignment is the largest single lever. Twelve of 17 unsupported predictions
    pair with a miss, including mismatches in event identity, temporal anchors and mention resolution.
    Fixing a paired representation can remove both errors. Two misaligned events account for five misses.
  - Ten plain omissions and four missing resolutions call for recall work using a coverage checklist.
    Five unsupported predictions on gold evidence warrant a gold-completeness or convention check.
  - Full-case success is strict on 12 cases. Per-assertion recall (0.856) and precision are better
    development signals. Full-case success remains the validation gate.
