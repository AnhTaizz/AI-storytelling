root_cause_attribution:
  - id: RC1_SCHEMA_IN_PROMPT_IS_NOT_SELF_CONTAINED
    category: B_PROMPT_INTERFACE_SPECIFICATION_GAP
    confidence: HIGH
    affects: PRIMARY_AND_REPAIR
    terminal_cases_explained: 9
    evidence:
      - The schema section of the locked system prompt is exactly the Draft V1.1 schema file.
      - That file defines the root object and Mention only, and refers by $ref to seven Draft V1 definitions.
      - The Draft V1 schema text is absent from the prompt; its identifier appears only as a $ref target.
      - The keys proposition_handle, epistemic_status, anchor_handle, anchor_kind, event_handle, evidence_sets, evidence_handles, derivations, premise_handles and rule_id appear nowhere in the prompt.
      - 483 of 483 primary and 545 of 545 repair schema errors lie in those absent definitions.
      - 0 schema errors lie in the root object or the Mention structure, which the prompt does define.
      - The repair system prompt is the primary system prompt plus a suffix, so it has the same gap.
  - id: RC2_MALFORMED_JSON_UNDER_JSON_MIME_MODE
    category: A_MODEL_STRUCTURAL_CONFORMANCE
    confidence: MEDIUM
    affects: PRIMARY_AND_REPAIR
    terminal_cases_explained: 1
    evidence:
      - 3 of 20 responses are not valid JSON. All three have the class MALFORMED_OBJECT_MEMBER, are not truncated and carry no prefix.
      - The request set the JSON response MIME type and no provider response schema.
      - Raw bytes are hash-locked at receipt, and the hashes verify.
  - id: RC3_SANITIZED_REPAIR_DIAGNOSTIC_CARRIES_PATH_ONLY
    category: C_REPAIR_DIAGNOSTIC_OR_REPAIR_PROMPT_LIMITATION
    confidence: MEDIUM
    affects: REPAIR
    role: SECONDARY_TO_RC1
    evidence:
      - Each schema blocker is phase, code and path. All 468 share one code and name no keyword and no field.
      - The JSON blocker has the root path and no position.
      - 0 of 10 repairs reached schema validity. Repairs cleared 14 of 228 primary schema blocker paths and introduced 0.
      - One repair returned bytes identical to its primary.
      - The definitions needed to correct the blockers were absent from the repair prompt as well, so RC1 alone would prevent a successful repair.
  - id: RC4_SCHEMA_OR_COMPILER_DEFECT
    category: D_SCHEMA_OR_COMPILER_DEFECT
    finding: NOT_SUPPORTED_BY_EVIDENCE
    confidence: HIGH
    evidence:
      - The replay of the unchanged validator is deterministic and equals all 20 recorded blocker sets.
      - The validator resolves the Draft V1 references correctly; committed tests show oracle drafts pass it.
      - The gap is in what the prompt shows the model, not in what the validator enforces.
  - id: RC5_EXECUTION_OR_SERIALIZATION_DEFECT
    category: E_EXECUTION_OR_SERIALIZATION_DEFECT
    finding: NOT_SUPPORTED_BY_EVIDENCE
    confidence: HIGH
    evidence:
      - All 20 raw-response hashes, 17 draft hashes and 10 failure-record hashes verify against the lock.
      - The identical DEV3_06 bytes came from two separate provider operations with different request fingerprints and prompt token counts.
  - id: RC6_OPEN_QUESTIONS
    category: F_INSUFFICIENT_EVIDENCE_FOR_ATTRIBUTION
    items:
      - Whether the DEV3_06 content would pass the schema is unknown; it never parsed.
      - Why DEV3_10 has far fewer blockers than the other cases was not investigated.
      - Whether a self-contained prompt would have produced valid drafts is unknown; it cannot be tested without a new run.
      - Extraction quality was not evaluated. No draft reached the compiler, and gold stayed sealed.

