interpretation:
  established:
  - 'The locked model and transport path accept a native response schema: the minimal baseline request returned
    a response.'
  - The provider accepts the exact P4 provider projection as the native response schema while the prompt carries
    the full model schema.
  - On one invented sentence, the response parsed, satisfied the projection, satisfied the unchanged full local
    validator and compiled, with no repair.
  - The accepted stage 2 request and the request rejected under protocol V1 are identical except for the native
    schema. The rejection therefore lies in what the projection removed or rewrote.
  not_established:
  - Extraction quality. None of this measures it.
  - The structural validity rate on real inputs. One short synthetic case is not a rate.
  - Which of the removed or rewritten keywords the provider had rejected. They were removed together.
  - How strictly the provider enforces the projection, and any behaviour of the repair path live.
  - Stability over time. Each request was sent once.
  what_the_provider_no_longer_enforces: Handle and identifier patterns, length bounds, uniqueness of handle lists,
    the non-empty argument map, the temporal-anchor conditional and the boolean placeholder constant. The model
    still sees all of them in the prompt and the local validator still enforces all of them.
