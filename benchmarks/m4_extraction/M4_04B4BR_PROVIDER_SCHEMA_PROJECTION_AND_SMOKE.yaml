summary: 'A deterministic provider projection of the full P4 model schema was built and proven to be a relaxation.
  Protocol V2 keeps the full schema in the prompt and sends the projection as the native response schema. Two synthetic
  live requests were made: the provider accepted a minimal native schema, then accepted the exact P4 projection
  and returned a response that parsed, passed the projection, passed the unchanged full local validator and compiled.
  This establishes the runtime path on one invented sentence. It is not an extraction-quality result.'
