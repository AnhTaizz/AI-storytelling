negative_results:
  - QR alone fixed 0 cases on every saved DEV1/DEV2 run; remaining blockers were mention placement, not copy noise.
  - P4R5 (contract role table verbatim) moved NamedAs, RefersTo and Possesses evidence to NARRATION_SUMMARY on DEV2
    (evidence-role accuracy 0.961 to 0.683); P4R6 replaced it.
dev1_findings:
  - Most DEV1 structural failures are QUOTE blockers on RefersTo mentions. The model numbers occurrence across the whole
    input instead of within the passage, and it places a name in a passage that does not contain it.
  - P4 variants recover fewer required assertions than P3 on the 4 COMPLETE cases (1 vs 4). The model creates new entities
    because the V1.1 prepared input lists existing entities by kind only; P3 matched by guessing an existing handle.
  - The EN option lowers unsupported predictions (4) and raises evidence-role accuracy (0.853). It changes the prepared
    input and therefore needs an owner decision on a Draft V1.2 interface before it can be locked.
interpretation:
  - Development leader for a fresh-set lock: P4R6 with QR and AM. It equals the best DEV2 recall among valid runs while
    keeping role accuracy, and AM is the largest single structural gain on real prose.
  - The FV2 protocol tooling still binds P4R4 with no host-side repair. Changing that binding and running FV2 are owner
    decisions.
