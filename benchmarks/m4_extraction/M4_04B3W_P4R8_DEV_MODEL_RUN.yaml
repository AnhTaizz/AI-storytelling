      primary: The model emitted a NamedAs name_kind token outside the vocabulary.
      replay: Every subset of the six host repairs, including none and all six, reproduced the same failure on the saved response.
      structural_repair: Failed on quote occurrences.
    event_kind_gains:
      source: The two event-kind misses diagnosed in M4-04B3V had the largest gains.
      hand_wave: {additional_recovered: 2, unsupported_p4r6: 3, unsupported_p4r8: 1}
      pick_up: {additional_recovered: 4, unsupported_p4r6: 5, unsupported_p4r8: 2}
    full_success: One case gained full success and another lost it with three unsupported predictions.
interpretation:
  - On the 11 common valid FV2-dev cases, P4R8 recovered 8 more required items and grounded 10 more. Missing entity resolutions fell from 7 to 4 and unsupported predictions from 14 to 13.
  - DEV2 recall was equal. The extra unsupported mention, name and speech predictions fall outside the new rules and are consistent with run-to-run variance. One sample per prompt cannot separate a prompt effect from variance.
  - The FV2-dev vocabulary failure was unrelated to the P4R8 rule changes and reproduced without host repairs. A vocabulary guard before compilation could recover such cases.
  - P4R8 + QR+AM+ME+SE+TB+DA is the candidate for the next locked validation.
