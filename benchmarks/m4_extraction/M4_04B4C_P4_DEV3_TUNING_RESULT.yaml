limitations:
- This is a tuning experiment on DEV3, which P3 had already failed on. It is not a fresh blind validation.
- Structural validity means a response parsed, satisfied the full Draft V1.1 contract and compiled. It says nothing about
  whether the extracted content is correct or complete.
- DEV3 gold was not opened and nothing was scored against it. Semantic recall, semantic precision, grounding accuracy, epistemic
  correctness and extraction quality are not established.
- The comparison with P3 is descriptive. P4 differs from P3 in the self-contained prompt schema, the provider-native schema
  projection and structural repair diagnostic V2, so no single cause is isolated.
- Each request was sent once to one model at temperature 0. Run-to-run variation was not measured.
- Ten cases from one source family. The result does not generalize beyond them.
- Fresh validation of P4 needs a later DEV4 that P4 has not been tuned on.
