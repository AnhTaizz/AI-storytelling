    9 compiled cases reproduce.
  mechanical: Missed classes, miss causes, missed-resolution classes and unmatched-prediction classes are deterministic
    rules (see the module docstring); re-running the tool gives the same counts.
  manual: The 29 unmatched predictions were adjudicated by the agent, post hoc, with the preregistered states and
    severity scale of M4_EXTRACTION_EVALUATION_PROTOCOL_V0 section 11. This is not a human review and it does not
    change the M4-04B3H scores.
taxonomy:
  missed_classes:
    REFERENT_MISMATCH: same predicate on overlapping evidence; an entity/event/anchor argument differs
    VALUE_MISMATCH: same predicate on overlapping evidence; a token, literal or nested value differs
    POLARITY_MISMATCH: same proposition with the other polarity
    OTHER_PREDICATE: the evidence was used only by predictions with other predicates
    NOT_EXTRACTED: no prediction cites overlapping evidence
  miss_causes:
    EVENT_NOT_ALIGNED: an event's kind differs (gold GENERIC, prediction ENCOUNTER), so every assertion about it
      misses
    LITERAL_WORDING: a literal value in another language or wording (gold source-language, prediction English)
    ROLE_LABEL: only the participant role differs (THEME/PATIENT, SOURCE/RECIPIENT vs AGENT)
    MISSING_PARTICIPANT: another participant of the same event was never asserted
    TEMPORAL_STRUCTURE: AnchorDate or TemporalRelation not asserted or anchored differently
    NAMING_NOT_EMITTED: NamedAs never asserted for a named entity
    OTHER_OMISSION: anything else not asserted
  missed_resolution_classes:
    MENTION_SPAN_DIFFERS: a predicted RefersTo covers an overlapping but different mention
    ENTITY_DIFFERS: same mention resolved to another entity
    NOT_EXTRACTED: no RefersTo on it
  unsupported_classes:
    PAIRED_WITH_MISSED_RESOLUTION: RefersTo on the evidence of a missed gold RefersTo
    PAIRED_WITH_MISS: same predicate and evidence as a missed gold assertion
    ON_GOLD_EVIDENCE: overlaps gold evidence with another predicate
    NO_GOLD_ON_EVIDENCE: no gold assertion on its evidence
