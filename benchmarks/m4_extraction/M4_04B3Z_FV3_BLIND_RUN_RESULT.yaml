interpretation:
  - The span repairs carried over. L1 passed on 9/15 valid FV3 cases against 4/12 on FV2 blind, with one wrong span on FV3.
  - The development gains in recall and precision did not transfer. FV3 recall was 0.793 and its unsupported rate was about twice FV2's blind rate. Rule selection on FV2-dev carried an acknowledged overfitting risk. FV3 stresses mixed-role passages, where 10 role mismatches occurred.
