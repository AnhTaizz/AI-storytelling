findings:
  - SE and TB reduced the span and transfer-bound errors they target. Recall, matched counts,
    unsupported counts and structural validity were unchanged on all three sets, with no
    regression in recall or precision.
  - DEV1 gained one role mismatch where a widened span covers gold evidence with a different role.
  - FV2 retained five L1 passes. DEV1 and DEV2 each gained one. Almost every failing case still
    has a dialogue-mention role error or a remaining span error. Further case-level gains need
    the owner's evidence-role rule.
