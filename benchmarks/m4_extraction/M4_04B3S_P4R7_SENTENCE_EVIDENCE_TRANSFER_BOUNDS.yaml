    fv2: {IN_WORLD_REPORT: 6, total: 7}
    dev1: {DEPICTION: 4, total: 4}
    dev2: {DEPICTION: 5, total: 5}
    finding: V2 leaves the evidence role of mentions in dialogue unspecified, and the gold conventions differ.
    resolution: An owner decision on a Conventions V3 rule is pending. No repair was built for this gap.
repairs:
  runner: tools/story_extraction/run_m4_p4_dev_v1.py
  order: [QR, AM, ME, SE, TB]
  sentence_evidence:
    tool: tools/story_extraction/draft_sentence_evidence_v1.py
    dev_option: --sentence-evidence
    suffix: +SE
    enabled_by_default: false
    behavior: >-
      Widens SUFFICIENT evidence for every predicate except RefersTo and NamedAs to the
      enclosing sentence or whole 「…」 region for dialogue. Refuses multi-sentence spans
      and never edits a shared evidence item in place.
  transfer_bounds:
    tool: tools/story_extraction/draft_transfer_bounds_v1.py
    dev_option: --transfer-bounds
    suffix: +TB
    enabled_by_default: false
    behavior: >-
      Sets an OPEN bound on an affirmed Possesses or Owns assertion to the anchor of the
      unique TRANSFER with the item as THEME and the holder as RECIPIENT for the start bound.
      For Possesses, it can also set the end bound when the holder is SOURCE. Refuses
      ambiguous transfers and bounds in the wrong text order.
