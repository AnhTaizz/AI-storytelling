    fv2: {whole_sentence: 93, refs: 96}
    dev1: {whole_sentence: 259, refs: 290}
    dev2: {whole_sentence: 5, refs: 60}
    shape: >-
      Narrow predictions cited a verb or a clause where gold cited the whole sentence.
      Whole dialogue lines include the enclosing 「…」 brackets. DEV2 gold uses clauses
      within sentences.
  transfer_bounds:
    predicates: [Possesses, Owns]
    fv2_validity_errors: 6
    predicted_open_on_both_bounds: 6
    gold_bounded_at_transfer_anchor: 6
