known_limitations:            # accepted for V0; NOT solved
  - id: F-EXISTENTIAL-CONTENT
    note: "Vague or de dicto content fits only an unresolvable placeholder; verdicts under-report safely."
  - id: F-RESOLUTION-PROPAGATION
    note: "SameContent resolution does not propagate into propositions that embed the placeholder."
  - id: F-CAUSATION-OMISSION
    note: "Causes takes events only; an omission or a state cannot be a cause."
  - id: F-FOCALIZATION
    note: "Focalized narration forces a choice between narrator truth and the focal character's belief."
  - id: F-GATE-BY-ANNOTATION
    note: "The INTERNAL_STATE gate checks evidence roles and relies on annotation discipline."
  - id: F-SPEECH-ACTS
    note: "Requests, permissions and agreements are not propositions; only assertive speech is modelled."
  - id: F-CONDITIONAL-BOUND
    note: "Conditional future end bounds are not expressible."
  - id: F-REPEATED-UTTERANCE
    note: "Repeated utterances of one claim collapse into one Says proposition."
  - id: ADDRESS-CONTEXT
    note: "Address-selection context is not first-class."
  - id: UNAWARE-PROVISIONAL
    note: "Polarity-specific UNAWARE is PROVISIONAL / NOT REAL-SOURCE VALIDATED."
  - id: LITERAL-NORMALIZATION
    note: "Free-text literal normalization is absent; proposition uniqueness is by exact content."
  - id: SINGLE-STREAM
    note: "Single discourse stream per document."
  - id: NO-STORY-TIME-SLICING
    note: "No full story-time slicing of verdicts."
  - id: NO-TEMPORAL-CLOSURE
    note: "No transitive closure of temporal relations."
  - id: RELIABLE-NARRATION
    note: "DEFAULT_V0 assumes reliable narration."

