non_blocking_findings:
  - id: F-ADDRESS-SETTING
    category: PREDICATE_VOCABULARY_GAP
    finding: "Address form depends on setting (private vs public); AddressesAs is functional on (speaker, addressee) with no setting, so co-existing forms raise a functional diagnostic."
  - id: F-DUP-PROP
    category: SCHEMA_GAP
    finding: "Propositions are meant to have identity by content, but duplicate-content propositions are accepted and split canonical commitments (found via a first-pass mapping error)."
  - id: F-HABITUAL
    category: PREDICATE_VOCABULARY_GAP
    finding: "Habitual/iterative facts (someone regularly does X) are central narrative facts; expressible additively as a stative predicate, frequency only as a literal."
  - id: F-STATE-EMOTION-OWNERSHIP-INTENTION
    category: PREDICATE_VOCABULARY_GAP
    finding: "Physical/health condition, emotion toward a target, ownership (vs custody) and intention are missing; all proved additive in the probe."
  - id: F-EXISTENTIAL-CONTENT
    category: SEMANTIC_GAP
    finding: "Vague or de dicto content ('some woman', 'a friend') fits only a placeholder and can never be resolved, because there is no propositional entailment; verdicts under-report safely."
  - id: F-RESOLUTION-PROPAGATION
    category: PROJECTION_GAP
    finding: "SameContent resolution does not propagate into propositions that embed the placeholder (a belief that something is hidden stays unresolved after discovery)."
  - id: F-CAUSATION-OMISSION
    category: SEMANTIC_GAP
    finding: "A cause stated as an omission or state cannot be expressed; Causes takes events only."
  - id: F-FOCALIZATION
    category: EPISTEMIC_LIMITATION
    finding: "Focalized narration of a world claim forces a choice between narrator truth and the focal character's belief (linked to deferred unreliable narration)."
  - id: F-GATE-BY-ANNOTATION
    category: EPISTEMIC_LIMITATION
    finding: "Depicted dialogue can be labelled DEPICTION and so pass the INTERNAL_STATE gate, and motives encoded as Causes are ungated; the gate relies on annotation discipline."
  - id: F-SPEECH-ACTS
    category: SEMANTIC_GAP
    finding: "Requests, permissions and agreements are not propositions; only assertive speech (Says) is modelled."
  - id: F-CONDITIONAL-BOUND
    category: TEMPORAL_LIMITATION
    finding: "Conditional future end bounds ('until we are no longer involved') are not expressible."
  - id: F-REPEATED-UTTERANCE
    category: ANNOTATION_AMBIGUITY
    finding: "Repeated utterances of one claim collapse into one Says proposition with several sufficient paths; acceptable, but utterance events are not distinguished."
validated_as_working_on_real_prose:
  - "Proposition vs Assertion vs Says vs Attitude separation (reported, focal and hedged content never became canonical)"
  - "Signed information (M2-05): concealment, discovery and reveal matched by content and polarity; reveal preserved polarity"
  - "Polarity-specific UNAWARE was not needed in the panel; no evidence against it"
  - "Late end bounds stay OPEN in earlier views; possession histories append rather than overwrite"
  - "Retrospective evidence: sufficient for occurrence but PARTIAL for details it does not repeat"
  - "Multi-path availability from the earliest complete path; multi-reference sufficient sets"
  - "Story chronology only from explicit temporal relations, never from discourse order"

